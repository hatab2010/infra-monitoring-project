name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код проекта
        uses: actions/checkout@v6

      - name: Проверить синтаксис Bash-скриптов
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh

      - name: Проверить доступность API
        run: ./check_api.sh https://httpbin.org/status/200
